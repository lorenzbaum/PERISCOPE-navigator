<mat-toolbar aria-label="Toolbar of the app" class="navigator-toolbar">
  <button mat-button routerLink="/" aria-label="Home button" color="primary">
    <mat-icon>home</mat-icon>
    <span aria-label="Name of the app">{{ title() }}</span>
  </button>

  <span class="spacer"></span>

  <button mat-icon-button [color]="like() ? 'error' : 'primary'" (click)="onLikeDislike()"
          [matTooltip]="like() ? dislikeString : likeString" aria-label="Like button">
    <mat-icon>favorite</mat-icon>
  </button>

  @if (theme() !== undefined) {
    <button mat-icon-button [matMenuTriggerFor]="themeMenu" aria-label="Toggle theme menu"
            matTooltip="Switch theme" color="primary">
      <mat-icon>{{ theme() == 'light' ? 'light_mode' : theme() == 'dark' ? 'dark_mode' : 'auto_awesome' }}</mat-icon>
    </button>
    <mat-menu #themeMenu="matMenu" yPosition="below" xPosition="after">
      <button mat-menu-item (click)="onSwitchTheme('auto')">
        <mat-icon>auto_awesome</mat-icon>
        <span i18n="theme">System</span>
      </button>
      <button mat-menu-item (click)="onSwitchTheme('light')">
        <mat-icon>light_mode</mat-icon>
        <span i18n="theme">Light</span>
      </button>
      <button mat-menu-item (click)="onSwitchTheme('dark')">
        <mat-icon>dark_mode</mat-icon>
        <span i18n="theme">Dark</span>
      </button>
    </mat-menu>
  }

  @if (languages.length > 2) {
    <button mat-icon-button [matMenuTriggerFor]="languageMenu" aria-label="Toggle language menu"
            i18n-matTooltip="language" matTooltip="Switch language">
      <mat-icon>language</mat-icon>
    </button>
    <mat-menu #languageMenu="matMenu" yPosition="below" xPosition="after">
      @for (lang of languages; track lang.language) {
        <button mat-menu-item (click)="onSwitchLanguage(lang)">
          <span>{{ lang.localizedName }}</span>
        </button>
      }
    </mat-menu>
  }

  <button mat-icon-button (click)="onShare()" i18n-matTooltip="Share button|tooltip" matTooltip="Share …"
          aria-label="Share button" color="primary">
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>
