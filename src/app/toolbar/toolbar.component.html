<mat-toolbar color="primary" i18n-aria-label="Toolbar|aria-label" aria-label="Toolbar of the app">
  <button mat-icon-button routerLink="/" i18n-aria-label="Home button|Description of home button" aria-label="Home button">
    <mat-icon>home</mat-icon>
  </button>

  <span i18n-aria-label="App name|aria-label" aria-label="Name of the app">{{ title() }}</span>

  <span class="spacer"></span>
  <mat-slide-toggle color="primary" [checked]="!theme" (change)="onSwitchTheme($event)" i18n-matTooltip matTooltip="Toggle theme"></mat-slide-toggle>
  <button mat-icon-button [color]="(like$ | async) ? 'warn' : undefined" (click)="onLikeDislike()"
          [matTooltip]="(like$ | async) ? dislikeString : likeString"
          i18n-aria-label="Like button|aria-label" aria-label="Like button">
    <mat-icon>favorite</mat-icon>
  </button>
  <button mat-icon-button (click)="onShare()" i18n-matTooltip="Share button|tooltip" matTooltip="Share..."
          i18n-aria-label="Share button|aria-label" aria-label="Share button">
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>
