<div mat-dialog-content>
  <img [ngSrc]="data.url" [width]="data.width" [height]="data.height" priority>
</div>
<div mat-dialog-actions>
  <button mat-icon-button (click)="onClose()" i18n-aria-label="Close button|aria" aria-label="Close button"
          i18n-matTooltip="Close button|tooltip" matTooltip="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>
