<div mat-dialog-title>{{ data.question }}</div>
<mat-dialog-content>
  <div>{{ data.additionalText }}</div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{ data.options.other }}</button>
  <button mat-flat-button [mat-dialog-close]="true" color="primary" cdkFocusInitial>{{ data.options.default }}</button>
</mat-dialog-actions>
