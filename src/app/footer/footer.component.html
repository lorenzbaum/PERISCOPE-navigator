<footer class="footer">
    <mat-grid-list [cols]="7" rowHeight="100px" gutterSize="16px">
        <mat-grid-tile [colspan]="2">
            <div style="padding-left: 24px;"
                 i18n-aria-label="App description|Footer" aria-label="App name and version number">
                {{ title }} <span style="font-size: smaller">({{ version }})</span>
            </div>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="3">
            <div i18n-aria-label="Contact description|Footer" aria-label="Contact address">
                <span i18n="Contact text|Footer">Contact:&nbsp;</span>
                <a href="mailto:baum@wiwi.uni-frankfurt.de?subject=BMN%20Feedback" style="color: black;">
                  baum@wiwi.uni-frankfurt.de
                </a>
            </div>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="2">
            <div style="padding-right: 24px;" i18n-aria-label="Copyright|Footer" aria-label="Copyright text" i18n>
              &copy;&nbsp;2023 Goethe University Frankfurt.
            </div>
        </mat-grid-tile>
    </mat-grid-list>
</footer>
