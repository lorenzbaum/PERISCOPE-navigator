    </mat-grid-tile>
    <mat-grid-tile [colspan]="3">
      <div>
        <span>Contact:&nbsp;</span>
        <a href="mailto:baum@wiwi.uni-frankfurt.de?subject=BMN%20Feedback" style="color: black;">baum@wiwi.uni-frankfurt.de</a>

    <mat-grid-tile [colspan]="2">

    </mat-grid-tile>
  </mat-grid-list>
