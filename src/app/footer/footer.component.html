<footer class="footer mat-body-medium">
  <mat-grid-list [cols]="isXSmall() ? 1 : 22" [rowHeight]="isXSmall() ? 40 : 150"
                 [gutterSize]="isXSmall() ? '5' : '16'">
    @if (!isXSmall()) {
      <mat-grid-tile colspan="1"></mat-grid-tile>
    }
    <mat-grid-tile [colspan]="isXSmall() ? 1 : 6">
      <div aria-label="App name and version number">
        {{ title }} <span style="font-size: smaller">({{ version }})</span>
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="isXSmall() ? 1 : 8">
      <div style="text-align: center;">
          <span aria-label="Copyright text" i18n>
            &copy;&nbsp;2026 Goethe University Frankfurt.
          </span><br>
        <span aria-label="Contact address">
          <span i18n="Contact text|Footer">Contact:&nbsp;</span>
          <a href="mailto:baum@wiwi.uni-frankfurt.de?subject=BMN%20Feedback" class="text-color">baum&#64;wiwi.uni-frankfurt.de</a>
        </span>
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="isXSmall() ? 1 : 6" [rowspan]="isXSmall() ? 3 : 1">
      <img ngSrc="BMBF_de.svg" alt="Logo" width="155" height="110" priority>
    </mat-grid-tile>
    @if (!isXSmall()) {
      <mat-grid-tile colspan="1"></mat-grid-tile>
    }
  </mat-grid-list>
</footer>
