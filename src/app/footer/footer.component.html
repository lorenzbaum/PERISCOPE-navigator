<footer class="footer">
  <mat-grid-list [cols]="(isXSmall$ | async) ? 1 : 22" [rowHeight]="(isXSmall$ | async) ? 30 : 100"
                 [gutterSize]="(isXSmall$ | async) ? '5' : '16'">
    <mat-grid-tile *ngIf="!(isXSmall$ | async)" colspan="1"></mat-grid-tile>
    <mat-grid-tile [colspan]="(isXSmall$ | async) ? 1 : 6">
      <div i18n-aria-label="App description|Footer" aria-label="App name and version number">
        {{ title }} <span style="font-size: smaller">({{ version }})</span>
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="(isXSmall$ | async) ? 1 : 8">
      <div i18n-aria-label="Contact description|Footer" aria-label="Contact address">
        <span i18n="Contact text|Footer">Contact:&nbsp;</span>
        <a href="mailto:baum@wiwi.uni-frankfurt.de?subject=BMN%20Feedback" style="color: black;">
          baum@wiwi.uni-frankfurt.de
        </a>
      </div>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="(isXSmall$ | async) ? 1 : 6">
      <div i18n-aria-label="Copyright|Footer" aria-label="Copyright text" i18n>
        &copy;&nbsp;2023 Goethe University Frankfurt.
      </div>
    </mat-grid-tile>
    <mat-grid-tile *ngIf="!(isXSmall$ | async)" colspan="1"></mat-grid-tile>
  </mat-grid-list>
</footer>
