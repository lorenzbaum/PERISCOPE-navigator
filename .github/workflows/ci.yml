name: Build & CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true
          install: true

      - name: Build project (with localization)
        run: pnpm run build
